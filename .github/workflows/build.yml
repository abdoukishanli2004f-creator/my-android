name: Build Web APK
on: [push]
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/pwapush

      - name: Create Web APK Package
        run: |
          echo "Preparing web manifest package..."
